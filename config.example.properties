# Copy this file to config.local.properties (git-ignored) and fill in the values.
# Copia este archivo como config.local.properties (no se sube al repo) y rellena los valores.

# REQUIRED for real recommendations. Free TMDB key: https://www.themoviedb.org/settings/api
# Set ONE of the two: the v3 "API Key" or the v4 "Read Access Token" (starts with eyJ...).
# Without it the launcher shows sample rows (datos/muestra.json).
TMDB_API_KEY=
TMDB_READ_TOKEN=

# OPTIONAL. Send launcher events (detail views, "Watch on...", searches, My List, what is playing)
# to your own HTTP endpoint. Empty = nothing is sent; events stay in a local queue
# (cola_eventos.jsonl in the app folder) and are retried once a URL and network exist.
# If the URL is plain http://, also add its host to app/src/main/res/xml/red_segura.xml.
EVENTOS_URL=
EVENTOS_TOKEN=
# Name this device reports itself as (default: firetv).
EVENTOS_DISPOSITIVO=

# OPTIONAL. AniList: marks the finished anime episode watched in Crunchyroll on your AniList account.
# Not compiled into the APK: put it in a config.local.properties inside the app's external folder
#   adb push config.local.properties /sdcard/Android/data/co.davidvega.launcher/files/
# Token: https://anilist.co/settings/developer
ANILIST_TOKEN=
